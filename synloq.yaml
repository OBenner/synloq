version: 1
project: synloq
language: en
agents:
  ceo:
    title: CEO
    role: Strategic priorities, product roadmap, and final arbitration of cross-role
      decisions
  cto:
    title: CTO
    role: Technical strategy, task decomposition, and coordination
  arch:
    title: Architect
    role: Architecture review, risks, and verification
  security:
    title: Security
    role: Security review, threat modeling, risk assessment, and hardening
  dev:
    title: Lead Developer
    role: Code ownership, implementation task decomposition, delegation to and review
      of dev2, final responsibility for pnpm verify
  dev2:
    title: Developer 2
    role: Implementation support on scoped tasks delegated by the Lead Developer;
      takes tasks from dev only, never directly from the CTO
  tester:
    title: Tester
    role: QA and verification, test and e2e execution, defect reports; never
      modifies production code, never commits to main
